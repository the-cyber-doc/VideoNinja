# Development: the production images, built from this checkout, run locally
# with the production settings (four containers, read-only, no capabilities,
# nginx in front), on the development backend's data in server/ (dev.db,
# dev.key, catalog/, media/, uploads/). Started by tools/docker-dev.sh, which
# runs them as the owner of server/ (the files stay yours). Stop the development
# backend first: both would encode the same queue.
# Open http://localhost:8080/videoninja/ (localhost: browsers accept the
# session's Secure cookie there without https).
name: videoninja-dev

x-build: &build
  context: .
  dockerfile: server/Dockerfile
  args:
    BASE_PATH: /videoninja
    APP_VERSION: dev
    APP_COMMIT: ${APP_COMMIT:-unknown}

x-hardened: &hardened
  user: "${VIDEONINJA_UID:?start with tools/docker-dev.sh}:${VIDEONINJA_GID:?start with tools/docker-dev.sh}"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

x-limits: &limits
  VIDEONINJA_MAX_UPLOAD_BYTES: "21474836480"   # 20 GiB; tusd's -max-size below too
  VIDEONINJA_FFMPEG_TIMEOUT_H: "24"
  VIDEONINJA_FFPROBE_TIMEOUT_MIN: "10"
  VIDEONINJA_INPUT_FORMATS: mov,matroska,avi,mpegts,mpeg,dv,asf

services:
  nginx:
    <<: *hardened
    build: { <<: *build, target: nginx }
    image: videoninja-nginx:dev
    volumes:
      - ./server/catalog:/srv/catalog:ro
      - ./server/media:/srv/media:ro
    networks:
      edge: {}
      backend: { ipv4_address: 172.30.82.10 }
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [api, tusd]

  api:
    <<: *hardened
    build: { <<: *build, target: api }
    image: videoninja-api:dev
    environment:
      <<: *limits
      VIDEONINJA_DB: /data/dev.db
      FORWARDED_ALLOW_IPS: 172.30.82.10   # nginx: the client's address is the one it saw
    volumes:
      # server/ as a whole: SQLite writes dev.db-wal and dev.db-shm next to dev.db.
      - ./server:/data
      # The key at the app's default path, like the production secret. Only here.
      - ./server/dev.key:/run/secrets/videoninja_key:ro
      - ./server/catalog:/srv/catalog
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://nginx:8080/videoninja/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s

  encoder:
    <<: *hardened
    build: { <<: *build, target: encoder }
    image: videoninja-encoder:dev
    environment:
      <<: *limits
      VIDEONINJA_DB: /data/dev.db
      VIDEONINJA_X265_PRESET: ultrafast   # short encodings while testing
    volumes:
      - ./server:/data
      - ./server/media:/srv/media
      - ./server/uploads:/srv/uploads
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-m", "app.encoder", "--health"]
      interval: 30s
      timeout: 10s
      start_period: 20s

  tusd:
    <<: *hardened
    build: { <<: *build, target: tusd }
    image: videoninja-tusd:dev
    command:
      - -host=0.0.0.0
      - -port=1080
      - -upload-dir=/srv/uploads
      - -base-path=/videoninja/files/
      - -behind-proxy
      - -disable-download
      - -expose-metrics=false
      - -max-size=21474836480
      - -hooks-http=http://api:8000/internal/tusd-hook
      - -hooks-enabled-events=pre-create,post-finish
      - -hooks-http-forward-headers=Cookie
    volumes:
      - ./server/uploads:/srv/uploads
    networks: [backend]

networks:
  edge: {}
  # No way out (internal): only nginx is also on edge, the way in.
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.82.0/24
