# Video Ninja: nginx in its own container (image videoninja-nginx), the only
# entry point: plain HTTP on 8080, behind your TLS reverse proxy (see the README,
# "Reverse proxy"). The API ("api:8000") and tusd ("tusd:1080") are the other
# containers of the compose file, on its internal network.
#
# The app is served under /videoninja/ (the image's BASE_PATH build argument; the
# Dockerfile replaces "/videoninja/" in this file when it differs). Your proxy
# forwards /videoninja/… unchanged; this file removes the base path before /api
# and /media reach the app.
#
# Paths in the container:
#   /srv/www/videoninja/  the SvelteKit build (static shell, no data; .br/.gz next to each file)
#   /srv/catalog          catalogue snapshots written by the API (read-only mount)
#   /srv/media/video      videos and their thumbnails, written by the encoder (read-only mount)
#   /tmp                  pid and temporary files (tmpfs: the rest is read-only)
#
# Every add_header is set once, in the server block, with per-path values from
# the maps below: a location with its own add_header would drop all the
# server's headers (nginx does not merge them), so no location has any.

# brotli_static: compiled for the image's nginx (server/Dockerfile, stage brotli-module).
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

# No "user": nginx runs as the container's user (non-root, UID 10001).
worker_processes auto;
pid /tmp/nginx.pid;
# The error log quotes the full request line (query string included): keep it
# at warn/error. To stderr: the container's log.
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Missing from (or wrong in) older mime.types. After the include; a
    # duplicate extension only logs a warning and the later entry wins.
    types {
        application/manifest+json  webmanifest;
        text/vtt                   vtt;
    }

    # Writable places only (read-only filesystem): nginx creates these at start.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server_tokens off;
    keepalive_timeout 65;

    # Files (videos included) go from disk to the socket in the kernel.
    sendfile   on;
    tcp_nopush on;

    # Never compress at request time: only precompressed files are served
    # (gzip_static / brotli_static per location). Videos and images are never
    # compressed.
    gzip      off;
    gzip_vary on;     # Vary: Accept-Encoding on the precompressed responses

    # "; charset=utf-8" on text responses that lack it (static files, the
    # app's own text/plain). Not JSON: always UTF-8 by definition (RFC 8259),
    # it has no charset parameter.
    charset       utf-8;
    charset_types text/css text/plain text/xml text/vtt application/javascript
                  application/manifest+json image/svg+xml;   # text/html always

    # --- Behind the TLS proxy ------------------------------------------------
    # The client's address from X-Forwarded-For, trusted only from private
    # addresses (the proxy, on this host or the Docker network): logs and the
    # app see the real client. The proxy overwrites the header with the address
    # it sees (never appends to what the client sent), so the single value is
    # taken as is (no recursion: a LAN client cannot hide behind a fake one).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive off;

    # The proxy's scheme and host (https, your domain) for tusd's upload URLs;
    # this server's own when called directly (tests, healthcheck).
    map $http_x_forwarded_proto $forwarded_proto {
        ""       $scheme;
        default  $http_x_forwarded_proto;
    }
    map $http_x_forwarded_host $forwarded_host {
        ""       $http_host;
        default  $http_x_forwarded_host;
    }

    # --- Logs ---------------------------------------------------------------
    # No query strings ($args): no tokens or ranges in the logs. $request would
    # include them, so log the path only. To stdout: the container's log.
    map $request_uri $request_path {
        ~^(?<p>[^?]*)  $p;
    }
    # rid: the request's ID, also sent to the app and tusd (X-Request-ID): the app's
    # lines of this request carry it ("request_id").
    log_format videoninja '$remote_addr [$time_iso8601] '
                          '"$request_method $request_path $server_protocol" '
                          '$status $body_bytes_sent rt=$request_time '
                          'rid=$request_id ua="$http_user_agent"';
    access_log /dev/stdout videoninja;

    # --- Per-path response headers -------------------------------------------
    # $uri is the final URI: after X-Accel-Redirect, the internal one
    # (/protected-catalog/…, /protected/…). An empty value adds no header.
    map $uri $cache_control {
        # App answers: the app sets its own Cache-Control. It sends none on
        # X-Accel-Redirect answers: the internal locations below decide.
        ~^/videoninja/api/              "";
        ~^/videoninja/media/            "";
        ~^/videoninja/files/            "";     # tusd (uploads) answers for itself
        # Hashed build assets: cache forever.
        ~^/videoninja/_app/immutable/   "public, max-age=31536000, immutable";
        # Catalogue: stable API URL, revalidated with the ETag (304 when
        # unchanged). Never no-store: the browser keeps it and revalidates.
        ~^/protected-catalog/  "private, no-cache";
        # Clips and thumbnails (/media/segment/<id>…), whole videos: not in the
        # browser's HTTP cache; the service worker saves clips and thumbnails
        # itself (kept for offline use, deleted on logout).
        ~^/protected/                  "private, no-store";
        ~^/protected-(clip|video)/     "private, no-store";
        # Shell, index.html, service-worker.js, manifest: always revalidate, or users get
        # stuck on an old version.
        default                "no-cache";
    }

    # The catalogue's API URL is the same for every language.
    map $uri $vary_language {
        ~^/protected-catalog/  "Accept-Language";
        default                "";
    }

    # Logout: wipe the browser's HTTP cache and storage (Cache API, IndexedDB,
    # service worker). For the whole origin: under a subfolder, also the
    # storage of the domain's other sites (accepted; the app also deletes its
    # own caches itself).
    map $uri $clear_site_data {
        /videoninja/api/auth/logout  '"cache", "storage"';
        default                      "";
    }

    # Editor route: only if the multithreaded ffmpeg.wasm fallback is used
    # (SharedArrayBuffer needs cross-origin isolation). Scoped to the editor
    # because COEP breaks cross-origin embeds elsewhere. Only applies on a
    # full page load of the editor: links to it need data-sveltekit-reload.
    map $uri $coop {
        # ~^/videoninja/editor  "same-origin";
        default    "";
    }
    map $uri $coep {
        # ~^/videoninja/editor  "require-corp";
        default    "";
    }

    # --- One video download per user at a time --------------------------------
    # The Pi cannot send many videos at once. The app puts the user's ID in the
    # internal URI (/protected-clip/<user id>/…, /protected-video/<user id>/…);
    # nginx counts the transfers in progress per ID and answers 429 over the
    # limit. A transfer ends when the file is sent or the client goes away.
    # The key comes from the location's regex (set before the limit is checked).
    limit_conn_zone $media_user zone=clip_downloads:1m;
    limit_conn_zone $media_user zone=video_downloads:1m;
    limit_conn_status    429;
    limit_conn_log_level warn;

    # --- Request rates per client address -----------------------------------
    # Generous for a person, not for a script: the app's own throttling (failed
    # credentials) stays the real defence against guessing; these keep a flood
    # from reaching the app (and its Argon2 password checks) at all. Over the
    # rate plus the burst: 429, JSON, Retry-After (@too_many below).
    # Credentials: the forms sent (POST), not the pages' own reads (GET /api/setup/status
    # on every page): an empty key is not counted.
    map $request_method $credentials_key {
        POST     $binary_remote_addr;
        default  "";
    }
    limit_req_zone $credentials_key    zone=credentials:10m rate=60r/m;  # login, setup, registration, passwords
    limit_req_zone $binary_remote_addr zone=api:10m         rate=20r/s;
    limit_req_zone $binary_remote_addr zone=media:10m       rate=50r/s;  # a page of thumbnails at once
    limit_req_zone $binary_remote_addr zone=uploads:10m     rate=10r/s;  # tus chunks, offsets
    limit_req_status    429;
    limit_req_log_level warn;
    # Retry-After on nginx's own 429 (limit_req, limit_conn) only: the app's carry
    # theirs (no upstream status = nginx answered itself).
    map "$status:$upstream_status" $retry_after {
        "429:"   5;
        default  "";
    }

    # The API and tusd: the other containers, on the compose file's internal
    # network (nothing else reaches them; tusd only after the app's check,
    # auth_request below). Found through Docker's DNS at each request (a
    # variable in proxy_pass): a container recreated with a new address is
    # reached again without restarting nginx, and nginx starts (and `nginx -t`
    # passes at build time) without them.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        set $api  api:8000;
        set $tusd tusd:1080;

        root /srv/www;
        client_max_body_size 1m;    # API requests only; uploads go to tusd
        # Redirects relative to the request (no http://…:8080 behind the proxy).
        absolute_redirect off;

        # --- Headers (see the maps above) -----------------------------------
        add_header Cache-Control   $cache_control   always;
        add_header Retry-After     $retry_after     always;
        add_header Vary            $vary_language   always;
        add_header Clear-Site-Data $clear_site_data always;
        add_header Cross-Origin-Opener-Policy   $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;

        # Strict-Transport-Security: sent by the TLS proxy for the whole domain,
        # not here (includeSubDomains from a subfolder would decide for the domain).
        add_header Referrer-Policy           "no-referrer" always;
        add_header X-Content-Type-Options    "nosniff"     always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        # The request's ID, as in the logs: a user can quote it when something failed.
        add_header X-Request-ID              $request_id always;
        # blob: for media (local files in the upload page, clips from the cache)
        # and workers; 'wasm-unsafe-eval' for WebAssembly (SHA-256 of uploads).
        # 'unsafe-inline' for styles (Svelte transitions, inline style attributes).
        # Scripts: the page also carries a CSP <meta> (SvelteKit, kit.csp) allowing
        # only its own inline boot script, by hash (new hash on every build). Both
        # policies apply, so 'unsafe-inline' here lets that one script through and
        # nothing else; without it the app does not start.
        # 'self' is the whole origin: under a subfolder, also the domain's other sites.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; media-src 'self' blob:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # nginx's own refusals (limit_req, limit_conn) in the app's error format.
        error_page 429 = @too_many;
        location @too_many {
            default_type application/json;
            return 429 '{"code":"rate_limited","detail":"Too many requests","params":{}}';
        }

        # --- To the app (inherited by the proxied locations) -----------------
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;   # the client (real_ip above)
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID      $request_id;    # nginx's own: a client's is replaced
        proxy_set_header Connection        "";
        # Buffer app responses by default; the app turns it off per response
        # with X-Accel-Buffering: no when it streams progress (e.g. the setup
        # wizard). Never add X-Accel-Buffering to proxy_ignore_headers.
        # Media is not proxied: after X-Accel-Redirect nginx streams the file itself.
        proxy_buffering on;

        # --- Static shell (public, no data) ---------------------------------
        location /videoninja/ {
            try_files $uri $uri/index.html /videoninja/index.html;   # SPA fallback
            gzip_static   on;
            brotli_static on;
        }

        # Hashed build assets. Missing file = 404, never index.html (the
        # service worker must not cache HTML as a script).
        location ^~ /videoninja/_app/immutable/ {
            try_files $uri =404;
            gzip_static   on;
            brotli_static on;
        }

        # --- App (session check on every request) ---------------------------
        # The base path is removed: the app answers /api/… and /media/….
        # No network restriction on any endpoint: every feature, admin
        # included, works from anywhere. The app checks session, access and
        # TOTP itself.
        # (With a variable in proxy_pass the URI is not replaced: rewrite removes
        # the base path; "break" keeps the request in this location.)
        location ^~ /videoninja/api/ {
            limit_req zone=api burst=100 nodelay;
            rewrite ^/videoninja/(api/.*)$ /$1 break;
            proxy_pass http://$api;

            # Credentials (each checked with Argon2): a few per minute and address.
            location ~ ^/videoninja/api/(auth/login|setup/|register/|profile/(password|totp)) {
                limit_req zone=api burst=100 nodelay;
                limit_req zone=credentials burst=30 nodelay;
                rewrite ^/videoninja/(api/.*)$ /$1 break;
                proxy_pass http://$api;
            }
        }

        # /media/segment/<id>…: the app answers with X-Accel-Redirect.
        location ^~ /videoninja/media/ {
            limit_req zone=media burst=300 nodelay;
            rewrite ^/videoninja/(media/.*)$ /$1 break;
            proxy_pass http://$api;
        }

        # Health check (the compose file's healthcheck), through nginx: the API
        # checks the database, the encoder and tusd (503 if one fails).
        location = /videoninja/health {
            proxy_pass http://$api/health;
        }

        # --- Uploads: tus protocol, very large files ----------------------------
        # The browser sends the original in 50 MB chunks (PATCH), each one a
        # bounded request that can be retried; an interrupted upload resumes
        # from its offset (HEAD). Every request, create and chunks alike, is
        # first checked by the app (auth_request: session, "upload" access,
        # the user's own upload). The total size is limited by tusd (-max-size)
        # and by the app's pre-create hook. tusd's base path includes
        # /videoninja: forwarded unchanged.
        location ^~ /videoninja/files/ {
            limit_req zone=uploads burst=50 nodelay;
            auth_request /_auth/upload;
            proxy_pass http://$tusd;
            client_max_body_size 64m;       # one chunk, with margin
            proxy_request_buffering off;    # stream to tusd: no temporary copy on the Pi
            proxy_buffering off;
            proxy_read_timeout 300s;        # a slow chunk on a slow link
            proxy_send_timeout 300s;
            # Own proxy_set_header lines: the server-level ones are not inherited.
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $remote_addr;
            # tusd builds the upload URLs from these: your domain, over https.
            proxy_set_header X-Forwarded-Host  $forwarded_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-ID      $request_id;    # in tusd's hook events to the app
            proxy_set_header Connection        "";
        }

        # The app's answer for one upload request: 2xx = forward, else refused.
        location = /_auth/upload {
            internal;
            proxy_pass http://$api/internal/upload-auth;
            proxy_pass_request_body off;    # headers only (the cookie), never the chunk
            # nginx checks the chunk's size here too: without this, the server's
            # 1m limit refuses every chunk over 1 MB (413). The upload location keeps its 64m.
            client_max_body_size 0;
            proxy_set_header Content-Length    "";
            proxy_set_header Host              $host;
            proxy_set_header X-Original-URI    $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Request-ID      $request_id;
        }

        # --- Internal locations (reachable only through X-Accel-Redirect) ---
        # Catalogue snapshots: /protected-catalog/<version>/catalog.<lang>.<hash>.json.
        # The app names a version directory, never changed once written, so a
        # snapshot swap cannot break a request in flight. .br and .gz are
        # written next to each JSON file. The ETag comes from the file served
        # (If-None-Match survives the internal redirect: 304 when unchanged).
        location ^~ /protected-catalog/ {
            internal;
            alias /srv/catalog/versions/;
            gzip_static   on;
            brotli_static on;
        }

        # Clips: one at a time per user. The mp4 module cuts the clip
        # (?start=&end=) into a standalone MP4; Range requests give 206.
        location ~ "^/protected-clip/(?<media_user>\d+)/(?<media_file>[0-9a-f]{2}/[0-9a-f]{64}/video\.mp4)$" {
            internal;
            alias /srv/media/video/$media_file;
            limit_conn clip_downloads 1;
            mp4;
            mp4_start_key_frame on;     # start on the IDR keyframe (every 1 s)
            mp4_buffer_size     1m;
            mp4_max_buffer_size 20m;    # the moov atom of long sources must fit
        }

        # Whole videos (Videos page, video managers): four transfers per user,
        # for the editor's player, frame measurement and film strip, and the
        # service worker's download that saves the video on the device.
        location ~ "^/protected-video/(?<media_user>\d+)/(?<media_file>[0-9a-f]{2}/[0-9a-f]{64}/video\.mp4)$" {
            internal;
            alias /srv/media/video/$media_file;
            limit_conn video_downloads 4;
        }

        # Thumbnails (not limited). No videos here: they go through the two
        # locations above, so that no transfer escapes the limits.
        location ^~ /protected/ {
            internal;
            alias /srv/media/video/;
            location ~ \.mp4$ {
                return 404;
            }
        }
    }
}
