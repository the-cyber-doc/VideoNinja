name: CodeQL

# Code scanning of the project's own code: GitHub's CodeQL for the Python backend, the
# frontend's JavaScript/TypeScript (.ts, and the scripts it can read; .svelte templates
# are not), and the workflows themselves (actions: injections, permissions). Results in
# the repository's Security tab (code scanning). Bandit, the Python linter, runs in
# ci-cd.yml's server tests and fails them on a finding.
# Third-party actions pinned by commit (a tag can be moved); Dependabot updates them.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'   # Mondays: new queries on unchanged code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d   # v4.38.3
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        # The default queries plus the security-extended ones (more findings, a few
        # more false positives).
        queries: security-extended
        config: |
          paths-ignore:
            - frontend/node_modules
            - frontend/build
            - '**/tests/**'

    - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d   # v4.38.3
      with:
        category: /language:${{ matrix.language }}
