name: CI/CD Pipeline

# Every push (any branch) and every PR: tests, frontend build, the four Docker
# images (nginx, api, encoder, tusd) built for both architectures (not published).
# Only a version tag (v1.2.3) publishes them to Docker Hub for users, as
# <user>/videoninja-<image>.
# Actions pinned by commit (a tag can be moved), the version in a comment; Dependabot
# updates them (.github/dependabot.yml).
on:
  push:
    branches: [ '**' ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: docker.io
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test (server)
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
      with:
        python-version: '3.15'
        cache: pip
        cache-dependency-path: server/requirements*.txt

    - name: Install dependencies
      working-directory: ./server
      run: |
        # Every package pinned with its hashes (requirements*.txt, from the .in files).
        pip install --require-hashes -r requirements-dev.txt
        # As in the Docker image: precompression of the catalogue snapshots,
        # ffmpeg for the encoding tests (tiny generated clips).
        sudo apt-get update && sudo apt-get install -y --no-install-recommends brotli zopfli ffmpeg

    - name: Run tests
      working-directory: ./server
      # With coverage: below its floor (pyproject.toml) the step fails.
      run: |
        pytest -v --tb=short --cov

    - name: Lint and format (Ruff)
      working-directory: ./server
      run: |
        ruff check app tests
        ruff format --check app tests

    - name: Types (mypy, strict)
      working-directory: ./server
      run: mypy

    # Python security linter: a new finding fails the tests. A reviewed one is marked
    # where it is (reason, then "# nosec <test id>").
    - name: Security lint (Bandit)
      working-directory: ./server
      run: bandit -r app -q

  test-frontend:
    runs-on: ubuntu-latest
    name: Test & build (frontend)
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    # The end-to-end browser tests start the real backend.
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
      with:
        python-version: '3.15'
        cache: pip
        cache-dependency-path: server/requirements*.txt

    - name: Install backend dependencies
      run: pip install --require-hashes -r server/requirements.txt

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7
      with:
        node-version: '26'   # as the frontend's build stage (dhi.io/node:26)
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Type-check
      working-directory: ./frontend
      run: npm run check

    - name: Unit tests
      working-directory: ./frontend
      run: npm run test:unit

    - name: Build
      working-directory: ./frontend
      env:
        # Shown on the About page: the release tag ("v" removed by the build, else "dev"), the commit.
        APP_VERSION: ${{ env.RELEASE == 'true' && github.ref_name || 'dev' }}
        APP_COMMIT: ${{ github.sha }}
      run: npm run build

    - name: Upload frontend build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
      with:
        name: frontend-build
        path: frontend/build
        if-no-files-found: error
        retention-days: 7

    - name: Install browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium webkit

    - name: Browser tests
      working-directory: ./frontend
      env:
        PYTHON: python   # from setup-python, with the backend dependencies
      run: npm run test:browser

    - name: Upload browser test report
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
      with:
        name: playwright-report
        path: |
          frontend/playwright-report
          frontend/.e2e/server.log
        retention-days: 7

  build:
    needs: [test, test-frontend]
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    permissions:
      contents: read

    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # The Dockerfile's final targets: one container each.
        image: [nginx, api, encoder, tusd]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      # Secrets are not available to PRs from forks: fall back to a local name (never pushed).
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/videoninja-${{ matrix.image }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    - name: Prepare platform pair
      run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4

    # The base images come from Docker Hardened Images (dhi.io): pulling them
    # needs a Docker account, on every build (not only releases). Not available
    # to pull requests from forks (no secrets): their image builds fail here.
    - name: Login to Docker Hardened Images
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6   # v4
      with:
        registry: dhi.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to DockerHub
      if: env.RELEASE == 'true'
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6   # v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata (labels)
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302   # v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    # Release: push by digest (tagged in merge-and-push). Otherwise: build only.
    - name: Build (and push by digest on release)
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7
      with:
        # Repository root: the image also builds frontend/ and needs nginx/ and
        # tools/encode-videos/ (server/Dockerfile.dockerignore keeps the context small).
        context: .
        file: ./server/Dockerfile
        target: ${{ matrix.image }}
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        # Shown on the About page: the release tag ("v" removed by the frontend build, else "dev"), the commit.
        build-args: |
          APP_VERSION=${{ env.RELEASE == 'true' && github.ref_name || 'dev' }}
          APP_COMMIT=${{ github.sha }}
        outputs: ${{ env.RELEASE == 'true' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) || 'type=cacheonly' }}
        cache-from: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
        cache-to: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }},mode=max
        # Releases: an SPDX SBOM (BuildKit's own Syft scanner) and the SLSA build
        # provenance, attached to each published image. Read them with
        #   docker buildx imagetools inspect <image>:<tag> --format '{{ json .SBOM }}'
        sbom: ${{ env.RELEASE == 'true' }}
        provenance: ${{ env.RELEASE == 'true' && 'mode=max' || 'false' }}

    - name: Export digest
      if: env.RELEASE == 'true'
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      if: env.RELEASE == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
      with:
        name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge-and-push:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish ${{ matrix.image }} to DockerHub
    permissions:
      contents: read

    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [nginx, api, encoder, tusd]
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/videoninja-${{ matrix.image }}

    steps:
    - name: Download digests
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8
      with:
        path: /tmp/digests
        pattern: digests-${{ matrix.image }}-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4

    - name: Login to DockerHub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6   # v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # v1.2.3 -> 1.2.3, 1.2, 1, latest
    - name: Extract metadata (tags)
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302   # v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
        flavor: |
          latest=auto

    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
