name: CI/CD Pipeline

# Every push (any branch) and every PR: tests, frontend build, the four Docker
# images (nginx, api, encoder, tusd) built for both architectures (not published).
# Only a version tag (v1.2.3) publishes them to Docker Hub for users, as
# <user>/videoninja-<image>, then creates its GitHub release (job release).
# Actions pinned by commit (a tag can be moved), the version in a comment; Dependabot
# updates them (.github/dependabot.yml).
on:
  push:
    branches: [ '**' ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: docker.io
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test (server)
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
      with:
        python-version: '3.15'
        cache: pip
        cache-dependency-path: server/requirements*.txt

    - name: Install dependencies
      working-directory: ./server
      run: |
        # Every package pinned with its hashes (requirements*.txt, from the .in files),
        # in server/.venv as in development (the git hooks' paths), first on the PATH.
        python -m venv .venv
        .venv/bin/pip install --require-hashes -r requirements-dev.txt
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        # As in the Docker image: precompression of the catalogue snapshots,
        # ffmpeg for the encoding tests (tiny generated clips).
        sudo apt-get update && sudo apt-get install -y --no-install-recommends brotli zopfli ffmpeg

    # The git hooks' hygiene checks (.pre-commit-config.yaml), for commits made without
    # them (Dependabot, GitHub's editor). The tools' hooks: their own steps (backend
    # below, frontend in its job).
    - name: Repository hygiene (pre-commit)
      env:
        SKIP: ruff-format,ruff-check,mypy,prettier,eslint
      run: pre-commit run --all-files --show-diff-on-failure

    - name: Run tests
      working-directory: ./server
      # With coverage: below its floor (pyproject.toml) the step fails.
      run: |
        pytest -v --tb=short --cov

    - name: Lint and format (Ruff)
      working-directory: ./server
      run: |
        ruff check app tests
        ruff format --check app tests

    - name: Types (mypy, strict)
      working-directory: ./server
      run: mypy

    # Python security linter: a new finding fails the tests. A reviewed one is marked
    # where it is (reason, then "# nosec <test id>").
    - name: Security lint (Bandit)
      working-directory: ./server
      run: bandit -r app -q

  test-frontend:
    runs-on: ubuntu-latest
    name: Test & build (frontend)
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    # The end-to-end browser tests start the real backend.
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
      with:
        python-version: '3.15'
        cache: pip
        cache-dependency-path: server/requirements*.txt

    - name: Install backend dependencies
      run: pip install --require-hashes -r server/requirements.txt

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7
      with:
        node-version: '26'   # as the frontend's build stage (dhi.io/node:26)
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Type-check
      working-directory: ./frontend
      run: npm run check

    - name: Lint and format (ESLint, Prettier)
      working-directory: ./frontend
      run: npm run lint

    # With coverage: below its floors (vite.config.ts) the step fails.
    - name: Unit tests
      working-directory: ./frontend
      run: npm run test:coverage

    - name: Build
      working-directory: ./frontend
      env:
        # Shown on the About page: the release tag ("v" removed by the build, else "dev"), the commit.
        APP_VERSION: ${{ env.RELEASE == 'true' && github.ref_name || 'dev' }}
        APP_COMMIT: ${{ github.sha }}
      run: npm run build

    - name: Upload frontend build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
      with:
        name: frontend-build
        path: frontend/build
        if-no-files-found: error
        retention-days: 7

    - name: Install browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium webkit

    - name: Browser tests
      working-directory: ./frontend
      env:
        PYTHON: python   # from setup-python, with the backend dependencies
      run: npm run test:browser

    - name: Upload browser test report
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
      with:
        name: playwright-report
        path: |
          frontend/playwright-report
          frontend/.e2e/server.log
        retention-days: 7

  build:
    needs: [test, test-frontend]
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    permissions:
      contents: read

    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # The Dockerfile's final targets: one container each.
        image: [nginx, api, encoder, tusd]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      # Secrets are not available to PRs from forks: fall back to a local name (never pushed).
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/videoninja-${{ matrix.image }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    - name: Prepare platform pair
      run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4

    # The base images come from Docker Hardened Images (dhi.io): pulling them
    # needs a Docker account, on every build (not only releases). Not available
    # to pull requests from forks (no secrets): their image builds fail here.
    - name: Login to Docker Hardened Images
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6   # v4
      with:
        registry: dhi.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to DockerHub
      if: env.RELEASE == 'true'
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6   # v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata (labels)
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302   # v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    # Release: push by digest (tagged in merge-and-push). Otherwise: build only.
    - name: Build (and push by digest on release)
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7
      with:
        # Repository root: the image also builds frontend/ and needs nginx/ and
        # tools/encode-videos/ (server/Dockerfile.dockerignore keeps the context small).
        context: .
        file: ./server/Dockerfile
        target: ${{ matrix.image }}
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        # Shown on the About page: the release tag ("v" removed by the frontend build, else "dev"), the commit.
        build-args: |
          APP_VERSION=${{ env.RELEASE == 'true' && github.ref_name || 'dev' }}
          APP_COMMIT=${{ github.sha }}
        outputs: ${{ env.RELEASE == 'true' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) || 'type=cacheonly' }}
        cache-from: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
        cache-to: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }},mode=max
        # Releases: an SPDX SBOM (BuildKit's own Syft scanner) and the SLSA build
        # provenance, attached to each published image. Read them with
        #   docker buildx imagetools inspect <image>:<tag> --format '{{ json .SBOM }}'
        sbom: ${{ env.RELEASE == 'true' }}
        provenance: ${{ env.RELEASE == 'true' && 'mode=max' || 'false' }}

    - name: Export digest
      if: env.RELEASE == 'true'
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      if: env.RELEASE == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
      with:
        name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge-and-push:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish ${{ matrix.image }} to DockerHub
    permissions:
      contents: read

    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [nginx, api, encoder, tusd]
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/videoninja-${{ matrix.image }}

    steps:
    - name: Download digests
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8
      with:
        path: /tmp/digests
        pattern: digests-${{ matrix.image }}-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4

    - name: Login to DockerHub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6   # v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # v1.2.3 -> 1.2.3, 1.2, 1, latest
    - name: Extract metadata (tags)
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302   # v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
        flavor: |
          latest=auto

    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

    # The manifest list's digest and its tags, for the GitHub release's notes.
    - name: Record digest and tags
      env:
        IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
      run: |
        mkdir -p /tmp/release
        docker buildx imagetools inspect "$IMAGE" --format '{{ json .Manifest }}' | jq -er .digest \
          > "/tmp/release/${{ matrix.image }}.digest"
        jq -r '.tags[] | sub(".*:"; "")' <<< "$DOCKER_METADATA_OUTPUT_JSON" > "/tmp/release/${{ matrix.image }}.tags"

    - name: Upload digest and tags
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
      with:
        name: release-digest-${{ matrix.image }}
        path: /tmp/release/${{ matrix.image }}.*
        if-no-files-found: error
        retention-days: 1

  # Once the four images are on Docker Hub: the GitHub release of the tag, with what
  # deploying needs (deploy/, the compose file pinned to this version; the encoding
  # script for use by hand) and the images' links, tags and digests. Run again, it
  # replaces its files (the notes stay as written, edited by hand maybe).
  release:
    needs: merge-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    name: GitHub release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    - name: Download digests
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8
      with:
        path: /tmp/digests
        pattern: release-digest-*
        merge-multiple: true

    - name: Assemble the files
      run: |
        version="${TAG#v}"
        mkdir -p dist
        # The README's compose file, its images pinned to this release (and to the
        # namespace they were published under).
        sed -e "s|thecyberdoc/videoninja-\([a-z]*\):latest|$NAMESPACE/videoninja-\1:$version|" \
          deploy/docker-compose.yaml > dist/docker-compose.yaml
        test "$(grep -c "videoninja-[a-z]*:$version" dist/docker-compose.yaml)" = 4
        cp deploy/reverse-proxy.conf dist/
        tar -czf dist/encode-videos.tar.gz --owner=0 --group=0 -C tools \
          encode-videos/encode-videos.sh encode-videos/nnedi3_weights.bin
        (cd dist && sha256sum -- * > SHA256SUMS)

    - name: Write the notes
      run: |
        version="${TAG#v}"
        readme="https://github.com/$GH_REPO/blob/$TAG/README.md"
        {
          echo "## Docker images"
          echo
          echo "Multi-arch (\`linux/amd64\`, \`linux/arm64\`), released together: run all four at the same version."
          echo "Tags: $(sed 's/.*/`&`/' /tmp/digests/nginx.tags | paste -sd ' ' | sed 's/ /, /g')."
          echo
          echo "| Image | Pull | Digest |"
          echo "|---|---|---|"
          for image in nginx api encoder tusd; do
            echo "| [videoninja-$image](https://hub.docker.com/r/$NAMESPACE/videoninja-$image/tags?name=$version)" \
              "| \`docker pull $NAMESPACE/videoninja-$image:$version\`" \
              "| \`$(cat "/tmp/digests/$image.digest")\` |"
          done
          echo
          echo "Each image carries its SPDX SBOM and SLSA provenance:"
          echo "\`docker buildx imagetools inspect $NAMESPACE/videoninja-api:$version --format '{{ json .SBOM }}'\`."
          echo
          echo "## Deploying"
          echo
          echo "| File | What |"
          echo "|---|---|"
          echo "| \`docker-compose.yaml\` | The four containers, images pinned to \`$version\` ([2. docker-compose.yaml]($readme#2-docker-composeyaml)) |"
          echo "| \`reverse-proxy.conf\` | The \`location\` blocks for your TLS proxy ([Your reverse proxy]($readme#your-reverse-proxy)) |"
          echo "| \`encode-videos.tar.gz\` | \`encode-videos.sh\` + NNEDI3 weights, to encode videos by hand before uploading (needs ffmpeg with libx265 and nnedi) |"
          echo "| \`SHA256SUMS\` | \`sha256sum -c SHA256SUMS --ignore-missing\` |"
          echo
          echo "New installation: follow [Production]($readme#production)."
          echo "Update: compare the new \`docker-compose.yaml\` with yours, then \`docker compose pull && docker compose up -d\`"
          echo "(the database is migrated at start, after a backup next to it)."
          echo
        } > notes.md
        cat notes.md

    - name: Create or update the release
      run: |
        version="${TAG#v}"
        if gh release view "$TAG" > /dev/null 2>&1; then
          gh release upload "$TAG" dist/* --clobber
        else
          prerelease=()
          [[ $version == *-* ]] && prerelease=(--prerelease)
          # Our notes first, then GitHub's list of changes since the previous tag.
          gh release create "$TAG" dist/* --verify-tag --title "Video Ninja $version" \
            --notes-file notes.md --generate-notes "${prerelease[@]}"
        fi
