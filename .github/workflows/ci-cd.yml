name: CI/CD Pipeline

# Every push (any branch) and every PR: tests, frontend build, Docker image
# build for both architectures (not published).
# Only a version tag (v1.2.3) publishes the images to Docker Hub for users.
on:
  push:
    branches: [ '**' ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: docker.io
  # Secrets are not available to PRs from forks: fall back to a local name (never pushed).
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/videoninja
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test (server)
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.15'
        cache: pip
        cache-dependency-path: server/requirements*.txt

    - name: Install dependencies
      working-directory: ./server
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        # As in the Docker image: precompression of the catalogue snapshots,
        # ffmpeg for the encoding tests (tiny generated clips).
        sudo apt-get update && sudo apt-get install -y --no-install-recommends brotli zopfli ffmpeg

    - name: Run tests
      working-directory: ./server
      run: |
        pytest -v --tb=short

    - name: Run linting (optional)
      working-directory: ./server
      run: |
        pip install flake8
        flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true

  test-frontend:
    runs-on: ubuntu-latest
    name: Test & build (frontend)
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5

    # The end-to-end browser tests start the real backend.
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.15'
        cache: pip
        cache-dependency-path: server/requirements*.txt

    - name: Install backend dependencies
      run: pip install -r server/requirements.txt

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Type-check
      working-directory: ./frontend
      run: npm run check

    - name: Unit tests
      working-directory: ./frontend
      run: npm run test:unit

    - name: Build
      working-directory: ./frontend
      run: npm run build

    - name: Upload frontend build
      uses: actions/upload-artifact@v7
      with:
        name: frontend-build
        path: frontend/build
        if-no-files-found: error
        retention-days: 7

    - name: Install browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium webkit

    - name: Browser tests
      working-directory: ./frontend
      env:
        PYTHON: python   # from setup-python, with the backend dependencies
      run: npm run test:browser

    - name: Upload browser test report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          frontend/playwright-report
          frontend/.e2e/server.log
        retention-days: 7

  build:
    needs: [test, test-frontend]
    name: Build image (${{ matrix.platform }})
    permissions:
      contents: read

    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v5

    - name: Prepare platform pair
      run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      if: env.RELEASE == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata (labels)
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    # Release: push by digest (tagged in merge-and-push). Otherwise: build only.
    - name: Build (and push by digest on release)
      id: build
      uses: docker/build-push-action@v7
      with:
        # Repository root: the image also needs tools/encode-videos/
        # (server/Dockerfile.dockerignore keeps the context small).
        context: .
        file: ./server/Dockerfile
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: ${{ env.RELEASE == 'true' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) || 'type=cacheonly' }}
        cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
        cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

    - name: Export digest
      if: env.RELEASE == 'true'
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      if: env.RELEASE == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ env.PLATFORM_PAIR }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge-and-push:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish release to DockerHub
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # v1.2.3 -> 1.2.3, 1.2, 1, latest
    - name: Extract metadata (tags)
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
        flavor: |
          latest=auto

    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
