name: Security

# The four images, built as CI builds them (amd64), and the sources: each described by
# an SPDX SBOM (Syft) and scanned for known vulnerabilities (Grype). Results in the
# repository's Security tab (code scanning) and the SBOMs as artifacts. Weekly: a new
# vulnerability in an unchanged image shows up without any push. Never fails the
# build: it reports; deciding what to update is yours (README, Security).
# Also: an issue when FFmpeg releases a newer version than server/Dockerfile's.
# Third-party actions pinned by commit (a tag can be moved); Dependabot updates them.
on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - server/requirements.txt
      - frontend/package-lock.json
      - server/Dockerfile
      - .github/workflows/security.yml

permissions:
  contents: read

jobs:
  images:
    name: Scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload to code scanning
    strategy:
      fail-fast: false
      matrix:
        image: [nginx, api, encoder, tusd]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4

    # The base images come from Docker Hardened Images (dhi.io).
    - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6   # v4
      with:
        registry: dhi.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build (amd64, as CI)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7
      with:
        context: .
        file: ./server/Dockerfile
        target: ${{ matrix.image }}
        platforms: linux/amd64
        load: true
        tags: videoninja-${{ matrix.image }}:scan
        cache-from: type=gha,scope=${{ matrix.image }}-linux-amd64

    - name: SBOM (SPDX)
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c   # v0.24.3
      with:
        image: videoninja-${{ matrix.image }}:scan
        format: spdx-json
        output-file: videoninja-${{ matrix.image }}.spdx.json
        artifact-name: videoninja-${{ matrix.image }}.spdx.json

    - name: Vulnerabilities
      id: scan
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439   # v7.4.2
      with:
        sbom: videoninja-${{ matrix.image }}.spdx.json
        fail-build: false
        output-format: sarif

    - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d   # v4.38.3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: image-${{ matrix.image }}

  sources:
    name: Scan the sources (npm, pip)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    # Every dependency, development ones too (frontend/package-lock.json,
    # server/requirements*.txt): also what builds the images.
    - name: SBOM (SPDX)
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c   # v0.24.3
      with:
        path: .
        format: spdx-json
        output-file: videoninja-sources.spdx.json
        artifact-name: videoninja-sources.spdx.json

    # The checkout itself, not the SBOM: SPDX keeps no file per package, and code
    # scanning refuses a result without one (the whole upload fails).
    - name: Vulnerabilities
      id: scan
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439   # v7.4.2
      with:
        path: .
        fail-build: false
        output-format: sarif

    - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d   # v4.38.3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: sources

  # ffmpeg is built from its source (server/Dockerfile), which Dependabot does not
  # follow: a newer release on ffmpeg.org opens an issue (one per version, never twice).
  releases:
    name: New ffmpeg release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    - name: Compare with server/Dockerfile
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        current=$(sed -n 's/^ARG FFMPEG_VERSION=//p' server/Dockerfile)
        if ! latest=$(curl -fsSL https://ffmpeg.org/releases/ \
            | grep -oE 'ffmpeg-[0-9]+(\.[0-9]+)*\.tar\.xz' | sed -E 's/^ffmpeg-(.*)\.tar\.xz$/\1/' \
            | sort -uV | tail -n 1) || [ -z "$latest" ]; then
          echo "::warning::ffmpeg.org/releases/ unreadable, no check this time"
          exit 0
        fi
        echo "server/Dockerfile: $current, ffmpeg.org: $latest"
        [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)" = "$current" ] && exit 0
        title="ffmpeg $latest available (server/Dockerfile: $current)"
        if [ "$(gh issue list --state all --search "\"ffmpeg $latest available\" in:title" --json number --jq length)" != 0 ]; then
          echo "Issue already opened: $title"
          exit 0
        fi
        gh issue create --title "$title" --body "$(cat <<EOF
        FFmpeg $latest is out: https://ffmpeg.org/download.html#releases (changes:
        https://github.com/FFmpeg/FFmpeg/blob/n$latest/Changelog).

        To update: check the tarball's signature (FFmpeg's release key, FCF9 86EA 15E6 E293
        A564 4F10 B432 2F04 D676 58D8), then set \`FFMPEG_VERSION\` and \`FFMPEG_SHA256\` in
        \`server/Dockerfile\` and build the encoder image (it checks libx265, nnedi, zscale,
        tonemap). Opened by the weekly Security workflow.
        EOF
        )"
